<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Morgan</title>
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
    <header>
        <h3>Alex Morgan</h3>
        <nav class="navbar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Skills</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <section class="hero">
        <div>
            <h1>Hello, I'm Alex Morgan</h1>
            <h3>Frontend Developer</h3>
            <p>I build modern and responsive</p>
            <button>View Projects</button>
            <button>Contact Me</button>
        </div>
    </section>

    <section class="about-section">
        <h2>ABOUT ME</h2>
        <p>Short biography, experience, location and professional facts</p>
    </section>

    <section class="skills-section">
        <h2>MY SKILLS</h2>
        <div class="skill-list">
            <article class="skill-card">
                <h3>HTML</h3>
            </article>
            <article class="skill-card">
                <h3>CSS</h3>
            </article>
            <article class="skill-card">
                <h3>JavaScript</h3>
            </article>
            <article class="skill-card">
                <h3>Git</h3>
            </article>
            <article class="skill-card">
                <h3>Responsive Design</h3>
            </article>
        </div>
    </section>
    <section>
        <h2>PROJECTS</h2>
        <div class="project-filter">
            <button>All</button>
            <button>JavaScript</button>
            <button>HTML/CSS</button>
            <button>Other</button>
        </div>
        <div id="project-container" class="project-container">

        </div>
    </section>
    <section id="contact">
        <h2>CONTACT</h2>

        <form id="contactForm">

            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>

            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Enter your message"></textarea>
            </div>

            <button type="submit">
                Send Message
            </button>

            <p id="formMessage"></p>

        </form>
    </section>
    <footer>
        
    </footer>
    <script src="script.js"></script>
</body>

</html>
